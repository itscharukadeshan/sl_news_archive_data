# @format

name: Scrape news archive

# Twice daily in Colombo time (UTC+5:30): 06:00 and 18:00.
on:
  schedule:
    - cron: "30 0 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      browserless:
        image: browserless/chrome:latest
        ports:
          - 3000:3000
        env:
          TOKEN: ci-token

    steps:
      - name: Checkout data repo
        uses: actions/checkout@v4

      - name: Checkout API repo
        uses: actions/checkout@v4
        with:
          repository: itscharukadeshan/sl_news_archive
          path: api

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Build API
        working-directory: api
        run: |
          npm ci
          npm run build
          echo 'BROWSERLESS_URL=ws://localhost:3000?token=ci-token' > .env
          echo 'PORT=3001' >> .env

      - name: Scrape all sources
        run: |
          (PORT=3001 nohup node api/dist/server.js > server.log 2>&1 &)
          for i in $(seq 1 12); do
            if curl -sf -m 5 http://localhost:3001/health; then break; fi
            sleep 10
          done
          curl -sf -m 5 http://localhost:3001/health
          STAMP=$(date +%F-%H-%M)
          for i in $(seq 1 3); do
            if curl -s -m 1500 "http://localhost:3001/archive-all" -o "archive-${STAMP}-all.json"; then break; fi
            sleep 60
          done
          test -s "archive-${STAMP}-all.json"

      - name: Process data
        working-directory: scripts
        run: bash start.sh

      - name: Commit and push results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add archive processed_data README.md combined_urls.txt decoded_urls.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📰 Auto-scrape $(date +%F)"
            git push
          fi
